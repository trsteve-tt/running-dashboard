<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Running Season 2026</title>
<style>
:root{--page:#F2F2F7;--card:#fff;--ink:#242428;--mut:#6D6D78;--line:#DFDFE8;--brand:#FC5200;
  --accent:#B83A00;--on-accent:#fff;--bad:#C2181F;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);display:grid;place-items:center;
  padding:24px 16px;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
form{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);
  border-left:8px solid var(--brand);border-radius:14px;padding:26px 24px;display:grid;gap:14px}
h1{margin:0;font-size:19px;text-wrap:balance}
p{margin:0;color:var(--mut);font-size:14px}
label{font-size:13px;font-weight:600}
input[type=password]{width:100%;font:16px ui-monospace,SFMono-Regular,Menlo,monospace;padding:11px 12px;
  border:1px solid var(--line);border-radius:9px;background:var(--page);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
button{font-family:inherit;font-size:15px;font-weight:600;padding:11px;border:0;border-radius:9px;
  background:var(--accent);color:var(--on-accent);cursor:pointer}
button[disabled]{opacity:.6;cursor:progress}
#err{color:var(--bad);font-size:13px;min-height:1.2em}
</style>
</head>

const KEY_SLOT = "rs2026-key";
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function reveal(key) {
  const html = new TextDecoder().decode(await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.ct)));
  document.open(); document.write(html); document.close();
}
async function derive(pass) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_SLOT); } catch (e) {}
  if (!saved) return;
  try {
    await reveal(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]));
  } catch (e) { try { localStorage.removeItem(KEY_SLOT); } catch (e2) {} }
})();
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const go = document.getElementById("go"), err = document.getElementById("err");
  go.disabled = true; go.textContent = "Unlocking…"; err.textContent = "";
  try {
    const key = await derive(document.getElementById("pw").value.trim());
    if (document.getElementById("remember").checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
      try { localStorage.setItem(KEY_SLOT, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    await reveal(key);
  } catch (e) {
    try { localStorage.removeItem(KEY_SLOT); } catch (e2) {}
    err.textContent = "That passphrase didn't work. Check it and try again.";
    go.disabled = false; go.textContent = "Open";
  }
});
